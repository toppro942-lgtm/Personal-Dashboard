<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Unterrichts-Copilot</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

<header class="bar">
  <button id="rec" class="rec" aria-pressed="false">● Start</button>
  <span id="clock" class="mono">00:00</span>
  <span id="badge" class="badge" title="lokal = Audio bleibt auf dem Gerät">aus</span>
  <span id="ctx" class="ctx"></span>
  <button id="gear" class="icon" aria-label="Einstellungen">⚙</button>
</header>

<main>
  <section id="card" class="card" aria-live="polite">
    <div class="card-h"><span id="mode" class="mono">Bereit</span><span id="state" class="mono"></span></div>
    <div id="answer" class="answer">
      <p class="hint">Start → Fragen der Lehrkraft werden erkannt und automatisch beantwortet. Transkriptzeile antippen = genau diese Stelle beantworten.</p>
    </div>
  </section>
  <ol id="log" class="log"></ol>
  <p id="interim" class="interim"></p>
</main>

<footer class="dock">
  <form id="askf"><input id="ask" placeholder="Eigene Frage …" autocomplete="off" enterkeyhint="send"></form>
  <div class="acts">
    <button data-mode="answer" class="primary">Antwort <kbd>A</kbd></button>
    <button data-mode="recap">Aufholen <kbd>R</kbd></button>
    <button data-mode="contribute">Beitrag <kbd>B</kbd></button>
  </div>
</footer>

<dialog id="cfg">
  <form method="dialog">
    <h2>Stunde</h2>
    <label>Fach<input name="fach" placeholder="z. B. Wirtschaft und Recht"></label>
    <label>Thema<input name="thema" placeholder="z. B. Geldpolitik der EZB"></label>
    <label>Material / Notizen<textarea name="notes" rows="4" placeholder="Tafelbild, Buchseite, Stichworte – erhöht die Treffsicherheit"></textarea></label>

    <h2>Setup</h2>
    <label>Anthropic API-Key<input name="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…"></label>
    <small>Bleibt ausschließlich in diesem Browser. In der Anthropic Console ein Ausgabenlimit setzen.</small>
    <label>Modell<select name="model" id="model"></select></label>
    <label>Erkennungssprache
      <select name="lang">
        <option value="de-DE">Deutsch</option>
        <option value="en-GB">Englisch (UK)</option>
        <option value="en-US">Englisch (US)</option>
        <option value="fr-FR">Französisch</option>
        <option value="es-ES">Spanisch</option>
        <option value="it-IT">Italienisch</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" name="auto"> Auto-Antwort bei erkannten Fragen</label>

    <div class="row">
      <button type="button" id="export">Export .md</button>
      <button type="button" id="reset" class="warn">Neue Stunde</button>
      <button value="ok" class="primary">Speichern</button>
    </div>
  </form>
</dialog>

</body>
</html>
